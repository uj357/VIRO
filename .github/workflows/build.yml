name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair and extract source archive
        run: |
          if [ -f DeskClock-GitHub-Ready.zip.b64 ]; then
            base64 --decode DeskClock-GitHub-Ready.zip.b64 > /tmp/DeskClock.zip
            zip -FF /tmp/DeskClock.zip --out /tmp/DeskClock-fixed.zip
            unzip -t /tmp/DeskClock-fixed.zip
            mkdir -p /tmp/DeskClock
            unzip -q /tmp/DeskClock-fixed.zip -d /tmp/DeskClock
            cp -a /tmp/DeskClock/app .
            cp /tmp/DeskClock/build.gradle.kts /tmp/DeskClock/settings.gradle.kts /tmp/DeskClock/gradle.properties /tmp/DeskClock/README.md /tmp/DeskClock/.gitignore .
            rm DeskClock-GitHub-Ready.zip.b64
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Add DeskClock Android project source"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DeskClock-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        if: startsWith(github.event.head_commit.message, 'Release VIRO v1.0.2')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: VIRO v1.0.2 — مساعد صوتي بدون زر
          target_commitish: ${{ github.sha }}
          body: |
            ## ما الجديد؟
            - إزالة زر المايك من الشاشة الرئيسية.
            - تشغيل الاستماع تلقائياً عند فتح VIRO بعد منح إذن الميكروفون.
            - عند قول «يا فيرو» يرد: «أهلاً يا جواد، تفضل شو بدك؟».
            - عند طلب تطبيق يقول «ثواني يا جواد» ثم يفتحه ويؤكد صوتياً.
            - دعم الأمر بجملة ثانية بعد كلمة التنبيه.
            - رقم الإصدار 1.0.2 (versionCode 3) لتحديث النسخة السابقة.
            
            ملاحظة: الاستماع المستمر عبر خدمة التعرف على الكلام قد يستهلك البطارية. يلزم منح إذن الميكروفون.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
